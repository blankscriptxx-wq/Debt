services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev_super_pw
      POSTGRES_DB: solvenda_dev
    ports: ["5432:5432"]
    volumes:
      - solvenda-pgdata:/var/lib/postgresql/data
      - ./packages/db/bootstrap/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./packages/db/bootstrap/databases.sql:/docker-entrypoint-initdb.d/20-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  solvenda-pgdata:
